# ─── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── DataSource (Railway injects DATABASE_URL automatically) ────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Parse Railway-style postgres:// URLs
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── App base URL ────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ─── Actuator (Railway health check) ─────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
